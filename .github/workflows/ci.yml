name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android build tools for embedded Shizuku
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install embedded native toolchain
        run: |
          sdkmanager --install --channel=3 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Test store build (no update requests)
        run: flutter test --dart-define=OFFLYNE_STORE=fdroid test/store_build_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        # Runs after the APK build so local.properties (flutter.sdk) exists.
        # Compiles the Kotlin test sources and the main sources they exercise.
        run: ./gradlew :app:testDebugUnitTest