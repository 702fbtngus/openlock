
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Test store build (no update requests)
        run: flutter test --dart-define=OFFLYNE_STORE=fdroid test/store_build_test.dart

      # PR builds do not have access to signing secrets.
      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      # Restore the same signing key used by release.yml.
      - name: Restore signing keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        if: github.event_name == 'push'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # The Gradle release signing config reads android/key.properties.
      - name: Build signed CI APK
        if: github.event_name == 'push'
        run: flutter build apk --release

      - name: Verify APK signature
        if: github.event_name == 'push'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed CI APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: openlock-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.keystore
