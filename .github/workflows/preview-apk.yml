
name: Build preview APK

on:
  workflow_dispatch:
    inputs:
      guard_diagnostics:
        description: Enable local guard screen diagnostics (adb logcat)
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_guardDiagnostics: ${{ inputs.guard_diagnostics }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test signing certificate verification
        run: python3 -m unittest discover -s scripts -p test_verify_apk_certificate.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # PR builds never receive the persistent signing identity.
      # A trusted preview must fail if secrets are missing, rather than silently
      # generating a different debug certificate and breaking update installs.
      - name: Restore fixed signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 scripts/restore_signing_key.py
          keytool -exportcert -keystore android/app/release.keystore \
            -storetype PKCS12 -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/openlock-signing-cert.der"

      - name: Set up Android build tools for embedded Shizuku
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install embedded native toolchain
        run: |
          sdkmanager --install --channel=3 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build PR test APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Kotlin guard regression tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify fixed APK signature
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" version
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/openlock-apk-cert.txt"
          python3 scripts/verify_apk_certificate.py \
            --certificate "$RUNNER_TEMP/openlock-signing-cert.der" \
            --report "$RUNNER_TEMP/openlock-apk-cert.txt"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openlock-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openlock-pr-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f android/key.properties android/app/release.keystore \
            "$RUNNER_TEMP/openlock-signing-cert.der" "$RUNNER_TEMP/openlock-apk-cert.txt"
