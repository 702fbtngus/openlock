
name: Build preview APK

on:
  workflow_dispatch:
    inputs:
      guard_diagnostics:
        description: Enable local guard screen diagnostics (adb logcat)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_guardDiagnostics: ${{ inputs.guard_diagnostics }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Kotlin guard regression tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openlock-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
